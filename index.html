<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Abfahrten</title>
<style>
body{background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif;margin:0;padding:20px 24px}
.flex{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center}
.grow{-webkit-box-flex:1;-webkit-flex:1;flex:1;min-width:0}
.stop{font-size:22px;color:#777;text-transform:uppercase;letter-spacing:2px;margin:22px 0 10px}

/* Kachel pro Richtung */
.tile{background:#0b0b0b;border-radius:18px;border-left:12px solid #333;padding:14px 22px;margin-bottom:14px}
.tile.ok{border-left-color:#4cd964}.tile.hurry{border-left-color:#ff9f0a}
.tile .flex{height:160px}
.head{font-size:38px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.then{font-size:24px;color:#999;margin-top:6px}
.right{text-align:right;padding-left:16px;width:230px}
.cap{font-size:22px;color:#888}
.big{font-size:130px;font-weight:bold;line-height:1;letter-spacing:-3px}
.big small{font-size:36px;font-weight:normal;letter-spacing:0;margin-left:4px}
.go{font-size:62px;font-weight:bold;line-height:1.05}

/* Bus: kompakte Zeilen */
.row{padding:10px 0;border-bottom:1px solid #1a1a1a}
.row .line{font-size:28px;font-weight:bold;width:80px}
.row .dir{font-size:26px;color:#ccc}
.row .then{font-size:20px;margin-top:2px}
.row .num{font-size:48px;font-weight:bold;padding-left:12px;text-align:right}
.row .num small{font-size:22px;font-weight:normal}

.ok .big,.ok .go,.num.ok{color:#4cd964}
.hurry .big,.hurry .go,.num.hurry{color:#ff9f0a}
.none{color:#444}
.stale{opacity:.45}
.note{color:#ff9f0a;font-size:20px;margin:-4px 0 12px}
.upd{color:#555;font-size:15px;margin-top:20px;text-align:center}
.upd a{color:#666}
</style>
</head>
<body>
<div id="out">lädt …</div>
<script>
// Bewusst altes JavaScript (ES5), damit es auch auf iPad 2 / iOS 9 läuft.
window.onerror = function (msg, src, line) {
  document.getElementById('out').innerHTML = 'Skriptfehler: ' + msg + ' (Zeile ' + line + ')';
};

// === HIER ANPASSEN ===
var KONTAKT = 'DEINE@EMAIL.DE';   // Transitous verlangt Kontaktangaben auf der Seite
var HURRY = 2;                     // bis zu so vielen Minuten Puffer: orange "jetzt los"
var STOPS = [
  { id:'900013103', tid:'de-VBB_de:11000:900013103', name:'U Prinzenstraße', lines:['U1','U3'], walk:5,
    // U1 und U3 werden pro Richtung zusammengefasst: es zählt die nächste erreichbare Bahn
    dirs:[ { label:'Warschauer Str.', match:/warschauer/i },
           { label:'Gleisdreieck',    match:null } ] },        // null = alle übrigen Ziele
  { id:'900016203', tid:'de-VBB_de:11000:900016203::1', name:'Klinikum Am Urban', lines:['M41'], walk:3 }
];
// =====================

var FORCE_T = /[?&]src=transitous/.test(location.search);  // Test: Adresse + ?src=transitous
var raw = {};
try { raw = JSON.parse(localStorage.getItem('raw2') || '{}') || {}; } catch (e) { raw = {}; }
var errors = {};
var busy = false, pref = 0, cycles = 0;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function hhmm(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function contains(arr, v) { for (var i = 0; i < arr.length; i++) if (arr[i] === v) return true; return false; }

// ISO-Zeit selbst parsen (alte Safari-Versionen sind da unzuverlässig)
function parseIso(s) {
  if (!s) return NaN;
  var m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d))?(?:\.\d+)?(Z|([+-])(\d\d):?(\d\d))?$/.exec(s);
  if (!m) return NaN;
  var t = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
  if (m[8]) {
    var off = (+m[9] * 60 + +m[10]) * 60000;
    t -= (m[8] === '+' ? off : -off);
  } else if (!m[7]) {
    t = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime();
  }
  return t;
}

// ---------- Datenquellen ----------
function getJson(url, ms, cb) {
  var done = false;
  var x = new XMLHttpRequest();
  function finish(err, data) { if (done) return; done = true; clearTimeout(timer); cb(err, data); }
  var timer = setTimeout(function () { try { x.abort(); } catch (e) {} finish('Zeitüberschreitung'); }, ms);
  x.open('GET', url, true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || done) return;
    if (x.status !== 200) return finish(x.status ? 'HTTP ' + x.status : 'keine Verbindung');
    var data;
    try { data = JSON.parse(x.responseText); } catch (e) { return finish('ungültige Antwort'); }
    finish(null, data);
  };
  x.send();
}

function normVbb(d) {
  var deps = (d && d.departures) || d || [], out = [];
  for (var i = 0; i < deps.length; i++) {
    var x = deps[i];
    if (!x.line || !x.when) continue;
    var t = parseIso(x.when);
    if (isNaN(t)) continue;
    out.push({ line:x.line.name, dir:x.direction || '', t:t, cancelled:!!x.cancelled, rt:x.delay != null });
  }
  return out;
}

function normTransitous(data) {
  var st = (data && data.stopTimes) || [], out = [];
  for (var i = 0; i < st.length; i++) {
    var x = st[i], p = x.place || {};
    var line = String(x.routeShortName || x.displayName || '');
    var t = parseIso(p.departure || p.scheduledDeparture || p.arrival);
    if (!line || isNaN(t)) continue;
    out.push({ line:line, dir:(x.headsign || '').replace(/\s*\(Berlin\)$/, ''), t:t,
               cancelled:!!(x.cancelled || x.tripCancelled || p.cancelled), rt:!!x.realTime });
  }
  return out;
}

var SOURCES = [
  { name:'VBB', load:function (s, cb) {
      getJson('https://v6.vbb.transport.rest/stops/' + s.id + '/departures?duration=40&results=30&remarks=false&language=de', 6000,
        function (err, d) { cb(err, err ? null : normVbb(d)); });
  }},
  { name:'Transitous', load:function (s, cb) {
      getJson('https://api.transitous.org/api/v6/stoptimes?stopId=' + encodeURIComponent(s.tid) + '&n=60', 12000,
        function (err, d) { cb(err, err ? null : normTransitous(d)); });
  }}
];

function fetchDeps(s, cb) {
  var order = FORCE_T ? [1] : (pref === 0 ? [0, 1] : [1, 0]);
  var errs = [], i = 0;
  (function next() {
    if (i >= order.length) return cb(errs.join(' | '));
    var k = order[i++];
    SOURCES[k].load(s, function (err, deps) {
      if (err) { errs.push(SOURCES[k].name + ': ' + err); return next(); }
      pref = k;
      cb(null, { deps:deps, src:SOURCES[k].name });
    });
  })();
}

function updateStop(s, cb) {
  fetchDeps(s, function (err, r) {
    if (err) { errors[s.id] = err; }
    else {
      raw[s.id] = { deps:r.deps, src:r.src, ts:new Date().getTime() };
      delete errors[s.id];
      try { localStorage.setItem('raw2', JSON.stringify(raw)); } catch (e) {}
    }
    cb();
  });
}

// ---------- Anzeige ----------
// Nur Abfahrten, die man zu Fuß noch erreicht; "leave" = Minuten bis zum Losgehen
function collect(s, deps) {
  var now = new Date().getTime(), list = [];
  for (var i = 0; i < deps.length; i++) {
    var d = deps[i];
    var line = String(d.line).replace(/\s+/g, '');
    if (d.cancelled || !contains(s.lines, line)) continue;
    var m = Math.floor((d.t - now) / 60000);
    if (m >= s.walk) list.push({ line:line, dir:d.dir, m:m, leave:m - s.walk, rt:d.rt });
  }
  list.sort(function (a, b) { return a.m - b.m; });
  return list;
}

function state(leave) { return leave <= HURRY ? 'hurry' : 'ok'; }
function mins(x) { return (x.rt ? '' : '~') + x.m; }

// Große Zahl rechts: wann muss ich los?
function bigLeave(x) {
  if (x.leave <= 0) return '<div class="go">JETZT<br>LOS</div>';
  return '<div class="cap">los in</div><div class="big">' + (x.rt ? '' : '~') + x.leave + '<small>min</small></div>';
}

// Prinzenstraße: eine Kachel pro Richtung, U1/U3 zusammen
function renderDirs(s, deps) {
  var list = collect(s, deps), html = '';
  for (var j = 0; j < s.dirs.length; j++) {
    var dir = s.dirs[j], items = [];
    for (var i = 0; i < list.length && items.length < 3; i++) {
      var east = s.dirs[0].match.test(list[i].dir);
      if (dir.match ? dir.match.test(list[i].dir) : !east) items.push(list[i]);
    }
    var x = items[0];
    var left = '<div class="head">→ ' + esc(dir.label) + '</div>';
    if (!x) {
      html += '<div class="tile"><div class="flex"><div class="grow">' + left +
              '<div class="then">keine Bahn in den nächsten 40 min</div></div>' +
              '<div class="right"><div class="big none">–</div></div></div></div>';
      continue;
    }
    var later = [];
    for (var k = 1; k < items.length; k++) later.push(mins(items[k]));
    left += '<div class="then">' + x.line + ' fährt in ' + mins(x) + ' min' +
            (later.length ? ' · danach ' + later.join(', ') : '') + '</div>';
    html += '<div class="tile ' + state(x.leave) + '"><div class="flex"><div class="grow">' + left +
            '</div><div class="right">' + bigLeave(x) + '</div></div></div>';
  }
  return html;
}

// Bus: eine kompakte Zeile pro Richtung
function renderRows(s, deps) {
  var list = collect(s, deps), groups = {}, order = [];
  for (var i = 0; i < list.length; i++) {
    var x = list[i], key = x.line + '|' + x.dir;
    if (!groups[key]) { groups[key] = { line:x.line, dir:x.dir, items:[] }; order.push(key); }
    if (groups[key].items.length < 3) groups[key].items.push(x);
  }
  if (!order.length) return '<div class="row then">Keine erreichbare Abfahrt in den nächsten Minuten.</div>';
  var html = '';
  for (var j = 0; j < order.length; j++) {
    var g = groups[order[j]], f = g.items[0], times = [];
    for (var k = 0; k < g.items.length; k++) times.push(mins(g.items[k]));
    html += '<div class="row flex"><span class="line">' + esc(g.line) + '</span>' +
            '<div class="grow"><div class="dir">' + esc(g.dir) + '</div>' +
            '<div class="then">fährt in ' + times.join(', ') + ' min</div></div>' +
            '<span class="num ' + state(f.leave) + '">' + (f.leave <= 0 ? 'los!' : (f.rt ? '' : '~') + f.leave + '<small> min</small>') + '</span></div>';
  }
  return html;
}

function draw() {
  var now = new Date().getTime(), html = '', srcs = [];
  for (var i = 0; i < STOPS.length; i++) {
    var s = STOPS[i], c = raw[s.id];
    var stale = c && now - c.ts > 150000;   // älter als 2,5 Min.
    html += '<div class="stop">' + esc(s.name) + ' · ' + s.walk + ' min Fußweg</div>';
    if (errors[s.id] || stale) {
      html += '<div class="note">' + (c ? 'Veraltet – Daten von ' + hhmm(c.ts) : 'Keine Verbindung') +
              (errors[s.id] ? ' (' + esc(errors[s.id]) + ')' : '') + '</div>';
    }
    if (c && c.deps) {
      html += '<div' + (stale ? ' class="stale"' : '') + '>' + (s.dirs ? renderDirs(s, c.deps) : renderRows(s, c.deps)) + '</div>';
      if (!contains(srcs, c.src)) srcs.push(c.src);
    }
  }
  html += '<div class="upd">Stand ' + hhmm(now) + (srcs.length ? ' · ' + srcs.join(' + ') : '') +
          ' · ~ = Fahrplan ohne Echtzeit · <a href="https://transitous.org/sources/">Datenquellen</a> · ' + esc(KONTAKT) + '</div>';
  document.getElementById('out').innerHTML = html;
}

function refresh() {
  if (busy) return;
  busy = true;
  if (++cycles % 20 === 0) pref = 0;   // alle ~10 Min. wieder zuerst den VBB-Server probieren
  var left = STOPS.length;
  for (var i = 0; i < STOPS.length; i++) {
    updateStop(STOPS[i], function () {
      if (--left === 0) { busy = false; draw(); }
    });
  }
}

draw();                        // gespeicherte Werte sofort zeigen
refresh();
setInterval(draw, 10000);      // Minuten neu berechnen
setInterval(refresh, 30000);   // neue Daten holen
</script>
</body>
</html>
