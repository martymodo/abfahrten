<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Abfahrten</title>
<style>
body{background:#000;color:#fff;font-family:Helvetica,Arial,sans-serif;margin:0;padding:24px}
.stop{font-size:30px;font-weight:bold;margin:28px 0 8px}
.sub{font-size:24px;color:#aaa;margin:18px 0 6px}
.cols{display:-webkit-box;display:-webkit-flex;display:flex;margin:0 -6px}
.cell{-webkit-box-flex:1;-webkit-flex:1;flex:1;background:#111;border-radius:14px;padding:10px 14px;margin:0 6px;text-align:center}
.cell .line{font-size:30px;font-weight:bold;width:auto}
.cell .to{font-size:18px;color:#888;min-height:22px}
.row{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:baseline;-webkit-align-items:baseline;align-items:baseline;padding:8px 0;border-bottom:1px solid #222}
.line{font-size:34px;font-weight:bold;width:100px}
.dir{-webkit-box-flex:1;-webkit-flex:1;flex:1;color:#aaa;font-size:26px;padding:0 12px}
.min{font-size:56px;font-weight:bold;text-align:right}
.cell .min{text-align:center}
.min small{font-size:30px;font-weight:normal}
.ok{color:#4cd964}.hurry{color:#ff9f0a}.late{color:#666}.none{color:#444}
.note{color:#ff9f0a;font-size:16px}
.upd{color:#666;font-size:16px;margin-top:18px;text-align:center}
.upd a{color:#888}
</style>
</head>
<body>
<div id="out">lädt …</div>
<script>
// Bewusst altes JavaScript (ES5), damit es auch auf iPad 2 / iOS 9 läuft.
window.onerror = function (msg, src, line) {
  document.getElementById('out').innerHTML = 'Skriptfehler: ' + msg + ' (Zeile ' + line + ')';
};

// === HIER ANPASSEN ===
var KONTAKT = 'DEINE@EMAIL.DE';   // Transitous verlangt Kontaktangaben auf der Seite
var STOPS = [
  { id:'900013103', tid:'de-VBB_de:11000:900013103',    name:'U Prinzenstraße',   lines:['U1','U3'], walk:5, split:true },
  { id:'900016203', tid:'de-VBB_de:11000:900016203::1', name:'Klinikum Am Urban', lines:['M41'],     walk:3 }
];
// =====================

var FORCE_T = /[?&]src=transitous/.test(location.search);  // Test: Adresse + ?src=transitous
var raw = {};
try { raw = JSON.parse(localStorage.getItem('raw2') || '{}') || {}; } catch (e) { raw = {}; }
var errors = {};
var busy = false, pref = 0, cycles = 0;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function pad(n) { return (n < 10 ? '0' : '') + n; }
function hhmm(ms) { var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function contains(arr, v) { for (var i = 0; i < arr.length; i++) if (arr[i] === v) return true; return false; }

// ISO-Zeit selbst parsen (alte Safari-Versionen sind da unzuverlässig)
function parseIso(s) {
  if (!s) return NaN;
  var m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)(?::(\d\d))?(?:\.\d+)?(Z|([+-])(\d\d):?(\d\d))?$/.exec(s);
  if (!m) return NaN;
  var t = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0));
  if (m[8]) {
    var off = (+m[9] * 60 + +m[10]) * 60000;
    t -= (m[8] === '+' ? off : -off);
  } else if (!m[7]) {
    t = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime();
  }
  return t;
}

function cls(m, walk) { return m < walk ? 'late' : (m < walk + 3 ? 'hurry' : 'ok'); }
function fmtMins(arr, walk) {
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var x = arr[i];
    out.push('<span class="' + cls(x.m, walk) + '">' + (x.rt ? '' : '~') + (x.m === 0 ? 'jetzt' : x.m) + '</span>');
  }
  return out.join(' <small>·</small> ');
}

// ---------- Datenquellen ----------
function getJson(url, ms, cb) {
  var done = false;
  var x = new XMLHttpRequest();
  function finish(err, data) { if (done) return; done = true; clearTimeout(timer); cb(err, data); }
  var timer = setTimeout(function () { try { x.abort(); } catch (e) {} finish('Zeitüberschreitung'); }, ms);
  x.open('GET', url, true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || done) return;
    if (x.status !== 200) return finish(x.status ? 'HTTP ' + x.status : 'keine Verbindung');
    var data;
    try { data = JSON.parse(x.responseText); } catch (e) { return finish('ungültige Antwort'); }
    finish(null, data);
  };
  x.send();
}

function normVbb(d) {
  var deps = (d && d.departures) || d || [], out = [];
  for (var i = 0; i < deps.length; i++) {
    var x = deps[i];
    if (!x.line || !x.when) continue;
    var t = parseIso(x.when);
    if (isNaN(t)) continue;
    out.push({ line:x.line.name, dir:x.direction || '', t:t, cancelled:!!x.cancelled, rt:x.delay != null });
  }
  return out;
}

function normTransitous(data) {
  var st = (data && data.stopTimes) || [], out = [];
  for (var i = 0; i < st.length; i++) {
    var x = st[i], p = x.place || {};
    var line = String(x.routeShortName || x.displayName || '');
    var t = parseIso(p.departure || p.scheduledDeparture || p.arrival);
    if (!line || isNaN(t)) continue;
    out.push({ line:line, dir:(x.headsign || '').replace(/\s*\(Berlin\)$/, ''), t:t,
               cancelled:!!(x.cancelled || x.tripCancelled || p.cancelled), rt:!!x.realTime });
  }
  return out;
}

var SOURCES = [
  { name:'VBB', load:function (s, cb) {
      getJson('https://v6.vbb.transport.rest/stops/' + s.id + '/departures?duration=40&results=30&remarks=false&language=de', 6000,
        function (err, d) { cb(err, err ? null : normVbb(d)); });
  }},
  { name:'Transitous', load:function (s, cb) {
      getJson('https://api.transitous.org/api/v6/stoptimes?stopId=' + encodeURIComponent(s.tid) + '&n=60', 12000,
        function (err, d) { cb(err, err ? null : normTransitous(d)); });
  }}
];

function fetchDeps(s, cb) {
  var order = FORCE_T ? [1] : (pref === 0 ? [0, 1] : [1, 0]);
  var errs = [], i = 0;
  (function next() {
    if (i >= order.length) return cb(errs.join(' | '));
    var k = order[i++];
    SOURCES[k].load(s, function (err, deps) {
      if (err) { errs.push(SOURCES[k].name + ': ' + err); return next(); }
      pref = k;
      cb(null, { deps:deps, src:SOURCES[k].name });
    });
  })();
}

function updateStop(s, cb) {
  fetchDeps(s, function (err, r) {
    if (err) { errors[s.id] = err; }
    else {
      raw[s.id] = { deps:r.deps, src:r.src, ts:new Date().getTime() };
      delete errors[s.id];
      try { localStorage.setItem('raw2', JSON.stringify(raw)); } catch (e) {}
    }
    cb();
  });
}

// ---------- Anzeige ----------
function collect(s, deps) {
  var now = new Date().getTime(), list = [];
  for (var i = 0; i < deps.length; i++) {
    var d = deps[i];
    var line = String(d.line).replace(/\s+/g, '');
    if (d.cancelled || !contains(s.lines, line)) continue;
    var m = Math.floor((d.t - now) / 60000);
    if (m >= 0) list.push({ line:line, dir:d.dir, m:m, rt:d.rt });
  }
  list.sort(function (a, b) { return a.m - b.m; });
  return list;
}

// Prinzenstraße: nach Richtung aufgeteilt, Linien nebeneinander
function renderSplit(s, deps) {
  var list = collect(s, deps);
  var sections = [
    { label:'Richtung Warschauer',   east:true },
    { label:'Richtung Gleisdreieck', east:false }
  ];
  var html = '<div class="stop">' + esc(s.name) + '</div>';
  for (var j = 0; j < sections.length; j++) {
    var sec = sections[j];
    html += '<div class="sub">' + sec.label + '</div><div class="cols">';
    for (var k = 0; k < s.lines.length; k++) {
      var line = s.lines[k], items = [];
      for (var i = 0; i < list.length && items.length < 2; i++) {
        if (list[i].line === line && /warschauer/i.test(list[i].dir) === sec.east) items.push(list[i]);
      }
      html += '<div class="cell"><div class="line">' + line + '</div>' +
        '<div class="to">' + (items[0] ? esc(items[0].dir) : '') + '</div>' +
        '<div class="min">' + (items.length ? fmtMins(items, s.walk) : '<span class="none">–</span>') + '</div></div>';
    }
    html += '</div>';
  }
  return html;
}

// Bus: eine Zeile pro Linie und Richtung
function renderRows(s, deps) {
  var list = collect(s, deps), groups = {}, order = [];
  for (var i = 0; i < list.length; i++) {
    var x = list[i], key = x.line + '|' + x.dir;
    if (!groups[key]) { groups[key] = { line:x.line, dir:x.dir, items:[] }; order.push(key); }
    if (groups[key].items.length < 2) groups[key].items.push(x);
  }
  var html = '<div class="stop">' + esc(s.name) + '</div>';
  if (!order.length) return html + '<div class="dir">Keine Abfahrt in den nächsten Minuten.</div>';
  for (var j = 0; j < order.length; j++) {
    var g = groups[order[j]];
    html += '<div class="row"><span class="line">' + esc(g.line) + '</span><span class="dir">' +
            esc(g.dir) + '</span><span class="min">' + fmtMins(g.items, s.walk) + '</span></div>';
  }
  return html;
}

function draw() {
  var html = '', srcs = [];
  for (var i = 0; i < STOPS.length; i++) {
    var s = STOPS[i], c = raw[s.id];
    if (c && c.deps) {
      html += s.split ? renderSplit(s, c.deps) : renderRows(s, c.deps);
      if (!contains(srcs, c.src)) srcs.push(c.src);
    } else {
      html += '<div class="stop">' + esc(s.name) + '</div>';
    }
    if (errors[s.id]) {
      html += '<div class="note">Keine Verbindung' + (c ? ' – Daten von ' + hhmm(c.ts) : '') +
              ' (' + esc(errors[s.id]) + ')</div>';
    }
  }
  html += '<div class="upd">Stand ' + hhmm(new Date().getTime()) + (srcs.length ? ' · Quelle: ' + srcs.join(' + ') : '') +
          ' · ~ = Fahrplanzeit ohne Echtzeit</div>' +
          '<div class="upd"><a href="https://transitous.org/sources/">Datenquellen (Transitous)</a> · Kontakt: ' + esc(KONTAKT) + '</div>';
  document.getElementById('out').innerHTML = html;
}

function refresh() {
  if (busy) return;
  busy = true;
  if (++cycles % 20 === 0) pref = 0;   // alle ~10 Min. wieder zuerst den VBB-Server probieren
  var left = STOPS.length;
  for (var i = 0; i < STOPS.length; i++) {
    updateStop(STOPS[i], function () {
      if (--left === 0) { busy = false; draw(); }
    });
  }
}

draw();                        // gespeicherte Werte sofort zeigen
refresh();
setInterval(draw, 10000);      // Minuten neu berechnen
setInterval(refresh, 30000);   // neue Daten holen
</script>
</body>
</html>
