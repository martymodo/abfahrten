// ---------- Datenquellen ----------
async function getJson(url, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

function normVbb(deps){
  return deps.filter(d => d.line && d.when).map(d => ({
    line: d.line.name, dir: d.direction || '', t: new Date(d.when).getTime(),
    cancelled: !!d.cancelled, rt: d.delay != null
  }));
}

function normTransitous(data){
  return (data.stopTimes || []).map(x => {
    const p = x.place || {};
    return {
      line: String(x.routeShortName || x.displayName || ''),
      dir: x.headsign || '',
      t: new Date(p.departure || p.scheduledDeparture || p.arrival).getTime(),
      cancelled: !!(x.cancelled || x.tripCancelled || p.cancelled),
      rt: !!x.realTime
    };
  }).filter(x => x.line && !isNaN(x.t));
}
